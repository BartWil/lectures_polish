project:
  type: website
  render:
    - index.qmd
    - content/**/*.qmd

website:
  title: "Materiały dydaktyczne"
  navbar:
    left:
      - href: index.qmd
        text: "Strona główna"
      - href: content/pfk/index.qmd
        text: "PFK"
  sidebar:
    - title: "Przedmioty"
      style: "docked"
      contents:
        - section: "Podstawy fizjoterapii klinicznej"
          contents:
            - content/pfk/index.qmd
            - section: "Ortopedia i traumatologia"
              contents:
                - content/pfk/ortopedia-traumatologia/index.qmd
                - text: "Złamania — mechanizmy i klasyfikacja"
                  href: content/pfk/ortopedia-traumatologia/zlamania-mechanizmy-klasyfikacja.qmd
                - text: "Złamania — diagnostyka obrazowa"
                  href: content/pfk/ortopedia-traumatologia/fracture-imaging-and-diagnosis.qmd
                - text: "Złamania — zasady leczenia"
                  href: content/pfk/ortopedia-traumatologia/fracture-treatment-principles.qmd
                - text: "Gojenie tkanek po urazie — podstawy"
                  href: content/pfk/ortopedia-traumatologia/healing-principles.qmd
                - text: "Rehabilitacja po urazie — zasady ogólne"
                  href: content/pfk/ortopedia-traumatologia/rehabilitation-after-injury-principles.qmd
            - content/pfk/medycyna-sportowa/index.qmd
            - section: "Protokoły rehabilitacji"
              contents:
                - content/pfk/protokoly-rehabilitacji/index.qmd
                - section: "Kolano"
                  contents:
                    - text: "ACLR — rehabilitacja po rekonstrukcji ACL"
                      href: content/pfk/protokoly-rehabilitacji/kolano/aclr-rehabilitacja.qmd
  page-footer:
    left: "Materiały dydaktyczne"
    right: "Strona zbudowana w Quarto"
  search: true

lang: pl
bibliography: references.bib

format:
  html:
    theme: cosmo
    css: shared/styles.scss
    toc: true
    toc-location: right
    link-external-newwindow: true

execute:
  freeze: auto
