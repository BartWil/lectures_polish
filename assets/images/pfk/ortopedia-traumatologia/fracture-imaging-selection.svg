<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
  <title id="title">Dobór obrazowania w podejrzeniu złamania</title>
  <desc id="desc">Schemat koncepcyjny pokazujący, że lokalizacja i mechanizm urazu, badanie kliniczne, pytanie diagnostyczne oraz wynik wcześniejszego badania wspólnie kierują doborem RTG, TK, MR albo innych metod. Cztery metody są równoległymi narzędziami, nie kolejnymi obowiązkowymi etapami.</desc>
  <style>
    .card { fill: #f4f5f5; stroke: #283238; stroke-width: 3; }
    .method { fill: #ffffff; stroke: #283238; stroke-width: 3; }
    .accent { fill: #f9ecea; stroke: #a33a32; stroke-width: 3; }
    .line { fill: none; stroke: #283238; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #6d777b; stroke-width: 2.5; stroke-dasharray: 7 6; stroke-linecap: round; }
    .heading { fill: #1b2428; font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 700; text-anchor: middle; }
    .label { fill: #1b2428; font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 700; text-anchor: middle; }
    .text { fill: #3f4a4f; font-family: Arial, Helvetica, sans-serif; font-size: 19px; text-anchor: middle; }
    .note { fill: #3f4a4f; font-family: Arial, Helvetica, sans-serif; font-size: 18px; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#283238"/>
    </marker>
  </defs>

  <rect class="card" x="52" y="48" width="230" height="134" rx="16"/>
  <text class="label" x="167" y="84">Kontekst urazu</text>
  <text class="text" x="167" y="116">okolica i mechanizm</text>
  <text class="text" x="167" y="144">objawy i badanie</text>
  <text class="text" x="167" y="172">kliniczne</text>

  <rect class="accent" x="335" y="42" width="230" height="146" rx="16"/>
  <text class="label" x="450" y="82">Pytanie kliniczne</text>
  <text class="text" x="450" y="116">czego trzeba się</text>
  <text class="text" x="450" y="144">dowiedzieć, aby</text>
  <text class="text" x="450" y="172">podjąć decyzję?</text>

  <rect class="card" x="618" y="48" width="230" height="134" rx="16"/>
  <text class="label" x="733" y="84">Dane dostępne</text>
  <text class="text" x="733" y="116">wynik wcześniejszego</text>
  <text class="text" x="733" y="144">badania i potrzeba</text>
  <text class="text" x="733" y="172">dalszej informacji</text>

  <path class="line" d="M282 115 H323"/>
  <path class="line" d="M618 115 H577"/>
  <path class="line" d="M450 190 V252"/>

  <rect class="card" x="270" y="258" width="360" height="86" rx="16"/>
  <text class="heading" x="450" y="294">Dobór metody celowany</text>
  <text class="text" x="450" y="322">względem pytania, nie według stałej sekwencji</text>

  <path class="line" d="M450 344 V390 H125 V422"/>
  <path class="line" d="M450 344 V390 H335 V422"/>
  <path class="line" d="M450 344 V390 H565 V422"/>
  <path class="line" d="M450 344 V390 H775 V422"/>

  <rect class="method" x="25" y="428" width="200" height="132" rx="16"/>
  <text class="label" x="125" y="466">RTG</text>
  <text class="text" x="125" y="498">często punkt wyjścia</text>
  <text class="text" x="125" y="526">ocena kości</text>

  <rect class="method" x="235" y="428" width="200" height="132" rx="16"/>
  <text class="label" x="335" y="466">TK</text>
  <text class="text" x="335" y="498">złożona anatomia</text>
  <text class="text" x="335" y="526">kostna / planowanie</text>

  <rect class="method" x="465" y="428" width="200" height="132" rx="16"/>
  <text class="label" x="565" y="466">MR</text>
  <text class="text" x="565" y="498">podejrzenie złamania</text>
  <text class="text" x="565" y="526">utajonego / tkanki miękkie</text>

  <rect class="method" x="675" y="428" width="200" height="132" rx="16"/>
  <text class="label" x="775" y="466">Inne metody</text>
  <text class="text" x="775" y="498">wybrane wskazania</text>
  <text class="text" x="775" y="526">np. śródzabiegowe</text>

  <path class="dash" d="M125 585 H775"/>
  <text class="note" x="450" y="620">Równoległe narzędzia: wybór zależy od sytuacji klinicznej i lokalnych zaleceń.</text>
</svg>
